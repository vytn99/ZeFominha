<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Zé Fominha</title>

    <link rel="stylesheet" href="style.css">

    <!-- Ícones -->
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=block" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>

    <!-- ---------------- HEADER ---------------- -->
    <header class="header">
        <div class="header-container">

            <a href="index.html" class="logo">
                <img src="./assets/zefominha.png" alt="Logo do Zé Fominha" class="logo-img">
                <span class="logo-text">
                    <span class="logo-title">Zé Fominha</span>
                    <span class="logo-subtitle">Deu fome? Pede no Zé Fominha que ela some!</span>
                </span>
            </a>

            <nav class="nav-base">
                <a href="./index.html" class="nav-link">Início</a>
                <a href="./cardapio.html" class="nav-link">Cardápio</a>
                <a href="./perfil.html" class="nav-link">Perfil</a>
                <a href="./sobre.html" class="nav-link">Sobre</a>
                <!-- Aparece só no celular -->
                <a href="./login.html" class="nav-link nav-login active">Login</a>
            </nav>

            <div class="header-actions">
                <a href="./login.html" class="header-login">Login</a>
                <button class="hamburguer" id="btn-menu" type="button" aria-label="Abrir menu">☰</button>
            </div>

        </div>
    </header>


    <main>
        <section class="section">
            <div class="container">
                <div class="box">
                    <h1 class="page-title">Entrar</h1>
                    <p class="page-sub">Entre na sua conta para fazer o pedido.</p>

                    <!-- Ainda sem back-end: o formulário só leva para o perfil -->
                    <form class="form" action="perfil.html">
                        <label for="usuario">Usuário</label>
                        <input type="text" id="usuario" class="input-field" placeholder="Seu usuário" required>

                        <label for="senha">Senha</label>
                        <input type="password" id="senha" class="input-field" placeholder="Sua senha" required>

                        <button type="submit" class="btn-main">Entrar</button>
                    </form>

                    <p class="form-note">Quer só ver o que tem? <a href="./cardapio.html">Abrir o cardápio</a></p>
                </div>
            </div>
        </section>
    </main>

    <!-- ---------------- FOOTER ---------------- -->
    <footer class="footer">
        <div class="container footer-container">

            <p class="footer-copy">
                &copy; <span id="ano"></span> Zé Fominha. Todos os direitos reservados.
            </p>

            <nav class="footer-links">
                <a href="./cardapio.html">Cardápio</a>
                <a href="./perfil.html">Perfil</a>
                <a href="./sobre.html">Sobre</a>
            </nav>

            <div class="social-links">
                <a href="https://instagram.com" target="_blank" aria-label="Instagram">
                    <i class="fa-brands fa-instagram" aria-hidden="true"></i>
                </a>
                <a href="https://wa.me/" target="_blank" aria-label="WhatsApp">
                    <i class="fa-brands fa-whatsapp" aria-hidden="true"></i>
                </a>
                <a href="https://facebook.com" target="_blank" aria-label="Facebook">
                    <i class="fa-brands fa-facebook" aria-hidden="true"></i>
                </a>
            </div>

        </div>
    </footer>

    <script src="js/main.js"></script>
</body>
</html>
